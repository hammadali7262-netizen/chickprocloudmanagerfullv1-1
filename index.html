<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ChickPro Manager v2</title>
<style>
:root{--red:#c91616;--yellow:#f7c600;--dark:#191919;--bg:#f5f5f5;--card:#fff;--muted:#666;--border:#e3e3e3;--green:#16834a;--blue:#2463eb;--orange:#c76a00}
*{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:var(--bg);color:#222}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}
.app{display:flex;min-height:100vh}.sidebar{width:245px;background:var(--dark);color:#fff;padding:18px 14px;position:sticky;top:0;height:100vh;overflow:auto}.brand{padding:6px 10px 18px;border-bottom:1px solid #333;margin-bottom:14px}.brand b{font-size:28px;color:var(--red)}.brand b span{color:var(--yellow)}.brand small{display:block;color:#ddd;margin-top:3px}.nav button{display:block;width:100%;padding:10px 12px;margin:4px 0;background:transparent;color:#ddd;text-align:left;border-radius:8px}.nav button:hover,.nav button.active{background:#2b2b2b;color:#fff;border-left:4px solid var(--yellow)}
.main{flex:1;padding:20px;min-width:0}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;gap:12px}.top h1{margin:0;font-size:26px}.top .date{color:var(--muted)}.page{display:none}.page.active{display:block}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card,.form-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;box-shadow:0 2px 8px rgba(0,0,0,.03)}.metric .label{color:var(--muted);font-size:13px}.metric .value{font-size:25px;font-weight:750;margin-top:7px}.metric .sub{font-size:12px;color:#777;margin-top:4px}.section{margin-top:18px}.section h2{font-size:18px;margin:0 0 10px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.btn{padding:10px 13px;border-radius:8px;background:#eee}.btn.primary{background:var(--red);color:#fff}.btn.yellow{background:var(--yellow);color:#111}.btn.green{background:var(--green);color:#fff}.btn.blue{background:var(--blue);color:#fff}.btn.danger{background:#b11c2c;color:#fff}.btn.small{padding:7px 9px;font-size:12px}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--border);border-radius:10px;overflow:hidden}.table th,.table td{padding:9px 10px;border-bottom:1px solid #eee;text-align:left;font-size:13px;white-space:nowrap}.table th{background:#fafafa;color:#555}.empty{padding:24px;text-align:center;color:#777;background:#fff;border:1px dashed #ccc;border-radius:10px}.form-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.field label{display:block;font-size:12px;font-weight:650;color:#555;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;padding:9px 10px;border:1px solid #ccc;border-radius:8px;background:#fff}.field textarea{min-height:76px;resize:vertical}.span-2{grid-column:span 2}.span-3{grid-column:span 3}.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}.tag{display:inline-block;padding:3px 7px;border-radius:999px;font-size:11px;background:#eee}.tag.green{background:#e5f7ed;color:#14673d}.tag.red{background:#fde8eb;color:#a61124}.tag.yellow{background:#fff5c8;color:#684f00}.tag.blue{background:#e7efff;color:#1f51ae}.alert{padding:10px 12px;background:#fff8d9;border:1px solid #f1da75;border-radius:9px;color:#5f4b00}.info{padding:10px 12px;background:#eef5ff;border:1px solid #cbdcff;border-radius:9px;color:#224b93}.two{display:grid;grid-template-columns:1.3fr 1fr;gap:14px}.notice{font-size:12px;color:#777}.kpi-row{display:flex;gap:8px;flex-wrap:wrap}.kpi{padding:8px 10px;border:1px solid var(--border);border-radius:8px;background:#fff;font-size:12px}.positive{color:var(--green)}.negative{color:#c0182b}.orange{color:var(--orange)}.helper{font-size:12px;color:#666;margin-top:5px}.highlight{background:#fffdf0;border:1px solid #f2df75;padding:12px;border-radius:10px}.formula{font-family:ui-monospace,Consolas,monospace;background:#fafafa;border:1px solid #eee;padding:8px;border-radius:7px;font-size:12px}.step{display:flex;gap:12px;margin:12px 0;align-items:flex-start}.step .num{min-width:28px;height:28px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center;font-weight:700}.mini{font-size:12px;color:#666}
@media(max-width:1050px){.sidebar{width:205px}.grid{grid-template-columns:repeat(2,1fr)}.form-grid{grid-template-columns:repeat(2,1fr)}.span-3{grid-column:span 2}.two{grid-template-columns:1fr}}@media(max-width:700px){.app{display:block}.sidebar{position:static;width:auto;height:auto}.nav{display:grid;grid-template-columns:repeat(2,1fr);gap:3px}.main{padding:12px}.grid{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr}.span-2,.span-3{grid-column:span 1}.top{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<div class="app"><aside class="sidebar"><div class="brand"><b>Chick<span>Pro</span></b><small>Freshness you can trust!</small></div><div class="nav" id="nav"></div></aside>
<main class="main"><div class="top"><div><h1 id="pageTitle">Dashboard</h1><div class="date" id="today"></div></div><div class="kpi-row" id="topKpis"></div></div>
<section id="dashboard" class="page active"></section><section id="sales" class="page"></section><section id="purchases" class="page"></section><section id="chicken" class="page"></section><section id="inventory" class="page"></section><section id="expenses" class="page"></section><section id="deliveries" class="page"></section><section id="customers" class="page"></section><section id="suppliers" class="page"></section><section id="staff" class="page"></section><section id="reports" class="page"></section><section id="guide" class="page"></section><section id="settings" class="page"></section>
</main></div>
<script>
const KEY='chickpro_v2';
const OLD_KEY='chickpro_v1';
function uid(){return 'CP'+Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function freshDB(){return {version:2,settings:{shopName:'ChickPro',tagline:'Freshness you can trust!',phone1:'03175841998',phone2:'03235400091',partnerShare:50,currency:'Rs.'},products:[
{id:uid(),name:'Live Chicken',category:'Chicken',unit:'kg',salePrice:330,cost:0,reorder:20,stock:0,birds:0,liveKg:0},
{id:uid(),name:'Fresh Cut Chicken',category:'Chicken',unit:'kg',salePrice:0,cost:0,reorder:20,stock:0,birds:0,liveKg:0},
{id:uid(),name:'Eggs',category:'Eggs',unit:'dozen',salePrice:0,cost:0,reorder:10,stock:0,birds:0,liveKg:0},
{id:uid(),name:'Frozen Item',category:'Frozen',unit:'pack',salePrice:0,cost:0,reorder:5,stock:0,birds:0,liveKg:0},
{id:uid(),name:'Marinated Item',category:'Marinated',unit:'pack',salePrice:0,cost:0,reorder:5,stock:0,birds:0,liveKg:0},
{id:uid(),name:'Packaging',category:'Packaging',unit:'pcs',salePrice:0,cost:0,reorder:20,stock:0,birds:0,liveKg:0}],sales:[],purchases:[],processing:[],wastage:[],expenses:[],deliveries:[],customers:[],suppliers:[],staff:[],stockMoves:[]}}
function normalizeDB(x){const d=freshDB();if(!x)return d;const out={...d,...x,settings:{...d.settings,...(x.settings||{})}};out.products=(x.products||d.products).map(p=>({...{category:'Other',unit:'pcs',salePrice:0,cost:0,reorder:0,stock:0,birds:0,liveKg:0},...p}));['sales','purchases','processing','wastage','expenses','deliveries','customers','suppliers','staff','stockMoves'].forEach(k=>out[k]=Array.isArray(x[k])?x[k]:[]);return out}
function load(){try{const x=localStorage.getItem(KEY);if(x)return normalizeDB(JSON.parse(x));const old=localStorage.getItem(OLD_KEY);if(old)return normalizeDB(JSON.parse(old))}catch(e){}return freshDB()}
let db=load(), currentPage='dashboard';
function save(){localStorage.setItem(KEY,JSON.stringify(db));renderAll()}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function money(n){return `${db.settings.currency} ${Number(n||0).toLocaleString('en-PK',{minimumFractionDigits:0,maximumFractionDigits:2})}`}
function qty(n){return Number(n||0).toLocaleString('en-PK',{minimumFractionDigits:0,maximumFractionDigits:3})}
function dateStr(d=new Date()){return d.toISOString().slice(0,10)}function nowStamp(){return new Date().toLocaleString()}
function findProd(id){return db.products.find(p=>p.id===id)} function v(id){return document.getElementById(id)?.value?.trim()||''} function n(id){return Number(document.getElementById(id)?.value||0)}
function sum(a,f){return a.reduce((t,x)=>t+(Number(f?f(x):x)||0),0)}
function productOptions(selected='',filter=''){return db.products.filter(p=>!filter||p.category===filter).map(p=>`<option value="${p.id}" ${p.id===selected?'selected':''}>${esc(p.name)} — ${esc(p.unit)}</option>`).join('')}
function unitLabel(u){const m={kg:'KG',bird:'BIRDS',dozen:'DOZEN',tray:'TRAY',pack:'PACK',pcs:'PCS',piece:'PIECE',box:'BOX',litre:'LITRE',other:'UNIT'};return m[u]||String(u||'UNIT').toUpperCase()}
function dailySales(){return db.sales.filter(x=>x.date===dateStr())}function dailyPurchases(){return db.purchases.filter(x=>x.date===dateStr())}function dailyExpenses(){return db.expenses.filter(x=>x.date===dateStr())}
function stats(){const sales=sum(dailySales(),x=>x.total),purchases=sum(dailyPurchases(),x=>x.total),expenses=sum(dailyExpenses(),x=>x.amount),cogs=sum(dailySales(),x=>x.cost*x.qty);return{sales,purchases,expenses,cogs,gross:sales-cogs,net:sales-cogs-expenses}}
function nav(){const items=[['dashboard','Dashboard'],['sales','Sales'],['purchases','Purchases'],['chicken','Chicken Process'],['inventory','Inventory'],['expenses','Expenses'],['deliveries','Delivery'],['customers','Customers'],['suppliers','Suppliers'],['staff','Staff'],['reports','Reports'],['guide','Use Guide'],['settings','Settings']];document.getElementById('nav').innerHTML=items.map(([id,label])=>`<button class="${currentPage===id?'active':''}" onclick="go('${id}')">${label}</button>`).join('')}
function go(id){currentPage=id;document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');document.getElementById('pageTitle').textContent=id==='chicken'?'Chicken Process':id[0].toUpperCase()+id.slice(1);renderAll();window.scrollTo({top:0,behavior:'smooth'})}

function renderDashboard(){const s=stats(),low=db.products.filter(p=>Number(p.stock)<=Number(p.reorder));const live=findLive();const recent=[...db.sales].sort((a,b)=>b.created.localeCompare(a.created)).slice(0,8);document.getElementById('dashboard').innerHTML=`
<div class="grid">${[['Today Sales',money(s.sales),''],['Today Purchases',money(s.purchases),''],['Today Expenses',money(s.expenses),''],['Estimated Net Profit',money(s.net),s.net>=0?'positive':'negative']].map(x=>`<div class="card metric"><div class="label">${x[0]}</div><div class="value ${x[2]}">${x[1]}</div><div class="sub">${dateStr()}</div></div>`).join('')}</div>
<div class="grid section"><div class="card metric"><div class="label">Live Chicken Stock</div><div class="value">${qty(live?.stock||0)} KG</div><div class="sub">${qty(live?.birds||0)} birds recorded</div></div><div class="card metric"><div class="label">Average Live Bird Weight</div><div class="value">${live&&live.birds?qty(live.stock/live.birds):'0'} KG</div><div class="sub">Based on recorded live stock</div></div><div class="card metric"><div class="label">Today's Processing</div><div class="value">${qty(sum(db.processing.filter(x=>x.date===dateStr()),x=>x.dressedKg))} KG</div><div class="sub">Dressed chicken produced</div></div><div class="card metric"><div class="label">Today's Mortality/Wastage</div><div class="value">${qty(sum(db.wastage.filter(x=>x.date===dateStr()),x=>x.kg))} KG</div><div class="sub">Recorded loss</div></div></div>
<div class="two section"><div><h2>Recent Sales</h2>${recent.length?`<div class="table-wrap"><table class="table"><thead><tr><th>Time</th><th>Customer</th><th>Product</th><th>Qty</th><th>Total</th><th>Type</th></tr></thead><tbody>${recent.map(x=>`<tr><td>${esc(x.created)}</td><td>${esc(x.customer||'Walk-in')}</td><td>${esc(findProd(x.productId)?.name||'-')}</td><td>${qty(x.qty)} ${unitLabel(x.unit)}</td><td>${money(x.total)}</td><td>${esc(x.channel)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No sales recorded yet.</div>'}</div><div><h2>Low Stock</h2>${low.length?`<table class="table"><thead><tr><th>Item</th><th>Stock</th><th>Reorder</th></tr></thead><tbody>${low.map(p=>`<tr><td>${esc(p.name)}</td><td class="negative">${qty(p.stock)} ${unitLabel(p.unit)}</td><td>${qty(p.reorder)}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">All items are above reorder level.</div>'}</div></div>`}

function renderSales(){const rows=[...db.sales].sort((a,b)=>b.created.localeCompare(a.created));document.getElementById('sales').innerHTML=`<div class="form-card"><h2>New Sale</h2><div class="form-grid"><div class="field"><label>Customer</label><input id="saleCustomer" placeholder="Walk-in customer"></div><div class="field"><label>Phone</label><input id="salePhone" placeholder="03XXXXXXXXX"></div><div class="field"><label>Channel</label><select id="saleChannel"><option>Walk-in</option><option>Phone/WhatsApp</option><option>Delivery</option><option>B2B</option></select></div><div class="field"><label>Product</label><select id="saleProduct" onchange="refreshSaleUnit()">${productOptions()}</select><div class="helper">Unit: <b id="saleUnitText">—</b></div></div><div class="field"><label>Quantity <span id="saleQtyLabel">(unit)</span></label><input id="saleQty" type="number" step="0.01" min="0.01" value="1"></div><div class="field"><label>Selling Rate <span id="saleRateLabel">(per unit)</span></label><input id="saleRate" type="number" step="0.01" min="0" placeholder="Auto from product"></div><div class="field"><label>Payment</label><select id="salePayment"><option>Cash</option><option>Online</option><option>Credit</option></select></div><div class="field"><label>Cutting / Order Note</label><input id="saleNote" placeholder="e.g. curry cut, no skin"></div><div class="field"><label>Delivery Address</label><input id="saleAddress" placeholder="Required for delivery"></div></div><div class="actions"><button class="btn primary" onclick="addSale()">Save Sale</button></div><div class="notice">The product's unit controls what Quantity means. Example: Live/Fresh Chicken = KG; Eggs = DOZEN; Frozen Item = PACK.</div></div><div class="section"><h2>Sales Register</h2>${rows.length?`<div class="table-wrap"><table class="table"><thead><tr><th>Date</th><th>Customer</th><th>Product</th><th>Qty</th><th>Rate</th><th>Total</th><th>Profit</th><th>Payment</th><th>Channel</th><th></th></tr></thead><tbody>${rows.map(x=>{const p=findProd(x.productId),profit=x.total-x.cost*x.qty;return `<tr><td>${x.date}</td><td>${esc(x.customer||'Walk-in')}</td><td>${esc(p?.name||'-')}</td><td>${qty(x.qty)} ${unitLabel(x.unit)}</td><td>${money(x.rate)}</td><td>${money(x.total)}</td><td class="${profit>=0?'positive':'negative'}">${money(profit)}</td><td>${esc(x.payment)}</td><td>${esc(x.channel)}</td><td><button class="btn small danger" onclick="delSale('${x.id}')">Delete</button></td></tr>`}).join('')}</tbody></table></div>`:'<div class="empty">No sales yet.</div>'}</div>`;refreshSaleUnit()}
function refreshSaleUnit(){const p=findProd(v('saleProduct'));if(!p)return;const t=unitLabel(p.unit);if(document.getElementById('saleUnitText'))document.getElementById('saleUnitText').textContent=t;if(document.getElementById('saleQtyLabel'))document.getElementById('saleQtyLabel').textContent='('+t+')';if(document.getElementById('saleRateLabel'))document.getElementById('saleRateLabel').textContent='(per '+t+')';const r=document.getElementById('saleRate');if(r&&!r.value&&p.salePrice)r.placeholder=String(p.salePrice)}
function addSale(){const pid=v('saleProduct'),p=findProd(pid),q=n('saleQty'),rateInput=v('saleRate'),rate=rateInput===''?Number(p?.salePrice||0):Number(rateInput);if(!p||q<=0||rate<0)return alert('Please select product and enter a valid quantity/rate.');if((p.stock||0)<q)return alert(`Not enough stock. Available: ${qty(p.stock)} ${unitLabel(p.unit)}`);const total=q*rate;const sale={id:uid(),date:dateStr(),created:nowStamp(),customer:v('saleCustomer'),phone:v('salePhone'),channel:v('saleChannel'),productId:pid,qty:q,unit:p.unit,rate,total,cost:Number(p.cost||0),payment:v('salePayment'),note:v('saleNote'),address:v('saleAddress')};db.sales.push(sale);p.stock-=q;if(v('saleChannel')==='Delivery')db.deliveries.push({id:uid(),date:dateStr(),created:nowStamp(),saleId:sale.id,customer:sale.customer,phone:sale.phone,address:sale.address,amount:total,status:'Pending',payment:sale.payment});save();alert('Sale saved.')}
function delSale(id){const x=db.sales.find(s=>s.id===id);if(!x)return;if(!confirm('Delete sale and restore stock?'))return;const p=findProd(x.productId);if(p)p.stock+=x.qty;db.sales=db.sales.filter(s=>s.id!==id);db.deliveries=db.deliveries.filter(d=>d.saleId!==id);save()}

function renderPurchases(){const rows=[...db.purchases].sort((a,b)=>b.created.localeCompare(a.created));document.getElementById('purchases').innerHTML=`<div class="form-card"><h2>New Purchase</h2><div class="form-grid"><div class="field"><label>Supplier</label><input id="purSupplier" placeholder="Supplier name"></div><div class="field"><label>Supplier Phone</label><input id="purPhone" placeholder="03XXXXXXXXX"></div><div class="field"><label>Product</label><select id="purProduct" onchange="refreshPurchaseUnit()">${productOptions()}</select><div class="helper">Unit: <b id="purUnitText">—</b></div></div><div class="field"><label>Quantity <span id="purQtyLabel">(unit)</span></label><input id="purQty" type="number" step="0.01" min="0.01"></div><div class="field" id="purBirdsWrap" style="display:none"><label>Number of Birds</label><input id="purBirds" type="number" step="1" min="0"></div><div class="field"><label>Purchase Rate <span id="purRateLabel">(per unit)</span></label><input id="purRate" type="number" step="0.01" min="0"></div><div class="field"><label>Payment</label><select id="purPayment"><option>Cash</option><option>Online</option><option>Credit</option></select></div><div class="field"><label>Invoice / Ref</label><input id="purRef"></div></div><div class="actions"><button class="btn primary" onclick="addPurchase()">Save Purchase</button></div><div class="notice">For Live Chicken, Quantity = total live weight in KG. Number of Birds is a separate field for bird count and average-weight tracking.</div></div><div class="section"><h2>Purchase Register</h2>${rows.length?`<div class="table-wrap"><table class="table"><thead><tr><th>Date</th><th>Supplier</th><th>Item</th><th>Quantity</th><th>Birds</th><th>Rate</th><th>Total</th><th>Payment</th><th></th></tr></thead><tbody>${rows.map(x=>`<tr><td>${x.date}</td><td>${esc(x.supplier||'-')}</td><td>${esc(findProd(x.productId)?.name||'-')}</td><td>${qty(x.qty)} ${unitLabel(x.unit)}</td><td>${x.birds?qty(x.birds):'-'}</td><td>${money(x.rate)}</td><td>${money(x.total)}</td><td>${esc(x.payment)}</td><td><button class="btn small danger" onclick="delPurchase('${x.id}')">Delete</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No purchases yet.</div>'}</div>`;refreshPurchaseUnit()}
function refreshPurchaseUnit(){const p=findProd(v('purProduct'));if(!p)return;const t=unitLabel(p.unit);if(document.getElementById('purUnitText'))document.getElementById('purUnitText').textContent=t;if(document.getElementById('purQtyLabel'))document.getElementById('purQtyLabel').textContent='('+t+')';if(document.getElementById('purRateLabel'))document.getElementById('purRateLabel').textContent='(per '+t+')';const birdWrap=document.getElementById('purBirdsWrap');if(birdWrap)birdWrap.style.display=p.name.toLowerCase()==='live chicken'?'block':'none'}
function addPurchase(){const pid=v('purProduct'),p=findProd(pid),q=n('purQty'),rate=n('purRate'),birds=n('purBirds');if(!p||q<=0||rate<0)return alert('Please enter valid purchase details.');const total=q*rate;const item={id:uid(),date:dateStr(),created:nowStamp(),supplier:v('purSupplier'),phone:v('purPhone'),productId:pid,qty:q,unit:p.unit,rate,total,payment:v('purPayment'),ref:v('purRef'),birds:p.name.toLowerCase()==='live chicken'?birds:0};db.purchases.push(item);p.stock=(Number(p.stock)||0)+q;p.cost=rate;if(p.name.toLowerCase()==='live chicken')p.birds=(Number(p.birds)||0)+birds; if(v('purSupplier')){const ex=db.suppliers.find(s=>s.name.toLowerCase()===v('purSupplier').toLowerCase());if(!ex)db.suppliers.push({id:uid(),name:v('purSupplier'),phone:v('purPhone'),notes:''})}save();alert('Purchase saved. Stock updated.')}
function delPurchase(id){const x=db.purchases.find(p=>p.id===id);if(!x)return;if(!confirm('Delete purchase and reverse stock?'))return;const p=findProd(x.productId);if(p){p.stock-=x.qty;if(p.name.toLowerCase()==='live chicken')p.birds=Math.max(0,(p.birds||0)-(x.birds||0));}db.purchases=db.purchases.filter(a=>a.id!==id);save()}

function findLive(){return db.products.find(p=>p.name.toLowerCase()==='live chicken')}
function findFresh(){return db.products.find(p=>p.name.toLowerCase()==='fresh cut chicken')}
function renderChicken(){const live=findLive(),fresh=findFresh(),processRows=[...db.processing].sort((a,b)=>b.created.localeCompare(a.created)),wasteRows=[...db.wastage].sort((a,b)=>b.created.localeCompare(a.created));const todayP=sum(db.processing.filter(x=>x.date===dateStr()),x=>x.dressedKg),todayLive=sum(db.processing.filter(x=>x.date===dateStr()),x=>x.liveKg),todayYield=todayLive?todayP/todayLive*100:0;document.getElementById('chicken').innerHTML=`<div class="info"><b>Recommended ChickPro chicken flow:</b> Buy live birds by KG + bird count → receive stock → record mortality/wastage → process birds → deduct live KG → add dressed KG → sell fresh chicken by KG. This keeps your live-to-dressed yield visible.</div><div class="grid section"><div class="card metric"><div class="label">Live Stock</div><div class="value">${qty(live?.stock||0)} KG</div><div class="sub">${qty(live?.birds||0)} birds recorded</div></div><div class="card metric"><div class="label">Fresh Cut Stock</div><div class="value">${qty(fresh?.stock||0)} KG</div><div class="sub">Saleable dressed chicken</div></div><div class="card metric"><div class="label">Today's Live Processed</div><div class="value">${qty(todayLive)} KG</div><div class="sub">Input live weight</div></div><div class="card metric"><div class="label">Today's Yield</div><div class="value">${qty(todayYield)}%</div><div class="sub">Dressed KG ÷ Live KG</div></div></div>
<div class="form-card section"><h2>1. Record Chicken Processing</h2><div class="form-grid"><div class="field"><label>Live Weight Consumed (KG)</label><input id="procLiveKg" type="number" step="0.01" min="0.01"><div class="helper">Available: ${qty(live?.stock||0)} KG</div></div><div class="field"><label>Birds Processed</label><input id="procBirds" type="number" step="1" min="0"></div><div class="field"><label>Dressed/Fresh Weight Produced (KG)</label><input id="procDressedKg" type="number" step="0.01" min="0.01"></div><div class="field"><label>Notes</label><input id="procNote" placeholder="Curry cut / standard processing etc."></div></div><div class="actions"><button class="btn primary" onclick="addProcessing()">Save Processing</button></div><div class="formula">Yield % = Dressed KG ÷ Live KG × 100 | Process Loss KG = Live KG − Dressed KG</div></div>
<div class="form-card section"><h2>2. Record Mortality / Wastage</h2><div class="form-grid"><div class="field"><label>Loss Category</label><select id="wasteType"><option>Mortality</option><option>Processing Waste</option><option>Damage</option><option>Other Wastage</option></select></div><div class="field"><label>KG Loss</label><input id="wasteKg" type="number" step="0.01" min="0.01"></div><div class="field"><label>Birds Lost (optional)</label><input id="wasteBirds" type="number" step="1" min="0"></div><div class="field span-2"><label>Notes</label><input id="wasteNote" placeholder="Reason / batch / supplier issue"></div></div><div class="actions"><button class="btn yellow" onclick="addWastage()">Save Wastage</button></div></div>
<div class="section"><h2>Processing Register</h2>${processRows.length?`<div class="table-wrap"><table class="table"><thead><tr><th>Date</th><th>Live KG</th><th>Birds</th><th>Dressed KG</th><th>Loss KG</th><th>Yield</th><th>Fresh Cost/KG</th><th>Note</th></tr></thead><tbody>${processRows.map(x=>`<tr><td>${x.date}</td><td>${qty(x.liveKg)}</td><td>${qty(x.birds)}</td><td>${qty(x.dressedKg)}</td><td>${qty(x.liveKg-x.dressedKg)}</td><td>${qty(x.yieldPct)}%</td><td>${money(x.freshCostKg)}</td><td>${esc(x.note)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No processing recorded yet.</div>'}</div>
<div class="section"><h2>Mortality / Wastage Register</h2>${wasteRows.length?`<div class="table-wrap"><table class="table"><thead><tr><th>Date</th><th>Type</th><th>KG</th><th>Birds</th><th>Notes</th></tr></thead><tbody>${wasteRows.map(x=>`<tr><td>${x.date}</td><td>${esc(x.type)}</td><td>${qty(x.kg)}</td><td>${qty(x.birds)}</td><td>${esc(x.note)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No wastage recorded yet.</div>'}</div>`}
function addProcessing(){const live=findLive(),fresh=findFresh(),liveKg=n('procLiveKg'),birds=n('procBirds'),dressed=n('procDressedKg');if(!live||!fresh)return alert('Live Chicken or Fresh Cut Chicken product is missing.');if(liveKg<=0||dressed<=0)return alert('Enter live and dressed KG.');if(dressed>liveKg)return alert('Dressed KG cannot be greater than live KG.');if(live.stock<liveKg)return alert(`Not enough live stock. Available ${qty(live.stock)} KG.`);const liveCost=Number(live.cost||0),freshCost=liveKg*liveCost/dressed;const row={id:uid(),date:dateStr(),created:nowStamp(),liveKg,birds,dressedKg:dressed,yieldPct:dressed/liveKg*100,freshCostKg:freshCost,note:v('procNote')};db.processing.push(row);live.stock-=liveKg;live.birds=Math.max(0,(live.birds||0)-birds);fresh.stock=(fresh.stock||0)+dressed;fresh.cost=freshCost;save();alert(`Processing saved. Yield: ${qty(row.yieldPct)}%. Fresh Cut Chicken cost updated to ${money(freshCost)}/KG.`)}
function addWastage(){const live=findLive(),kg=n('wasteKg'),birds=n('wasteBirds');if(kg<=0)return alert('Enter a valid loss KG.');if(live&&live.stock<kg)return alert(`Live stock is only ${qty(live.stock)} KG.`);db.wastage.push({id:uid(),date:dateStr(),created:nowStamp(),type:v('wasteType'),kg,birds,note:v('wasteNote')});if(live){live.stock-=kg;live.birds=Math.max(0,(live.birds||0)-birds)}save();alert('Wastage recorded and live stock reduced.')}

function renderInventory(){document.getElementById('inventory').innerHTML=`<div class="alert"><b>Units are explicit.</b> Quantity is always measured in the product's configured unit. Live Chicken = KG (with optional bird count); Eggs = DOZEN; Frozen products = PACK; Packaging = PCS. You can add more products with their own unit.</div><div class="section"><div class="toolbar"><button class="btn primary" onclick="showProductForm()">Add Product</button></div><h2>Current Stock</h2><div class="table-wrap"><table class="table"><thead><tr><th>Item</th><th>Category</th><th>Unit</th><th>Stock</th><th>Birds</th><th>Cost/Unit</th><th>Sale/Unit</th><th>Reorder</th><th></th></tr></thead><tbody>${db.products.map(p=>`<tr><td>${esc(p.name)}</td><td>${esc(p.category)}</td><td><span class="tag blue">${unitLabel(p.unit)}</span></td><td class="${p.stock<=p.reorder?'negative':''}">${qty(p.stock)} ${unitLabel(p.unit)}</td><td>${p.name.toLowerCase()==='live chicken'?qty(p.birds):'-'}</td><td>${money(p.cost)}</td><td>${money(p.salePrice)}</td><td>${qty(p.reorder)}</td><td><button class="btn small" onclick="editProduct('${p.id}')">Edit</button></td></tr>`).join('')}</tbody></table></div></div><div id="productForm" class="section"></div>`}
function showProductForm(id=''){const p=id?findProd(id):null;document.getElementById('productForm').innerHTML=`<div class="form-card"><h2>${p?'Edit':'Add'} Product</h2><div class="form-grid"><div class="field"><label>Product Name</label><input id="prName" value="${esc(p?.name||'')}"></div><div class="field"><label>Category</label><select id="prCategory"><option ${p?.category==='Chicken'?'selected':''}>Chicken</option><option ${p?.category==='Eggs'?'selected':''}>Eggs</option><option ${p?.category==='Frozen'?'selected':''}>Frozen</option><option ${p?.category==='Marinated'?'selected':''}>Marinated</option><option ${p?.category==='Packaging'?'selected':''}>Packaging</option><option ${p?.category==='Other'?'selected':''}>Other</option></select></div><div class="field"><label>Unit</label><select id="prUnit">${['kg','bird','dozen','tray','pack','pcs','piece','box','litre','other'].map(u=>`<option value="${u}" ${p?.unit===u?'selected':''}>${unitLabel(u)}</option>`).join('')}</select><div class="helper">This controls what Quantity means in purchase and sales.</div></div><div class="field"><label>Sale Price / Unit</label><input id="prSale" type="number" step="0.01" value="${p?.salePrice||0}"></div><div class="field"><label>Cost / Unit</label><input id="prCost" type="number" step="0.01" value="${p?.cost||0}"></div><div class="field"><label>Reorder Level</label><input id="prReorder" type="number" step="0.01" value="${p?.reorder||0}"></div></div><div class="actions"><button class="btn" onclick="document.getElementById('productForm').innerHTML=''">Cancel</button><button class="btn primary" onclick="saveProduct('${id}')">Save Product</button></div></div>`}
function saveProduct(id){const name=v('prName'),cat=v('prCategory'),unit=v('prUnit');if(!name)return alert('Enter product name.');if(id){const p=findProd(id);p.name=name;p.category=cat;p.unit=unit;p.salePrice=n('prSale');p.cost=n('prCost');p.reorder=n('prReorder')}else db.products.push({id:uid(),name,category:cat,unit,salePrice:n('prSale'),cost:n('prCost'),reorder:n('prReorder'),stock:0,birds:0,liveKg:0});save();alert('Product saved.')}function editProduct(id){renderInventory();showProductForm(id)}

function renderExpenses(){const rows=[...db.expenses].sort((a,b)=>b.created.localeCompare(a.created));document.getElementById('expenses').innerHTML=`<div class="form-card"><h2>New Expense</h2><div class="form-grid"><div class="field"><label>Category</label><select id="exCategory"><option>Rent</option><option>Electricity</option><option>Salary/Wages</option><option>Delivery/Fuel</option><option>Cleaning</option><option>Maintenance</option><option>Marketing</option><option>Other</option></select></div><div class="field"><label>Amount</label><input id="exAmount" type="number" step="0.01" min="0"></div><div class="field"><label>Payment</label><select id="exPayment"><option>Cash</option><option>Online</option></select></div><div class="field span-2"><label>Note</label><input id="exNote" placeholder="Expense details"></div></div><div class="actions"><button class="btn primary" onclick="addExpense()">Save Expense</button></div></div><div class="section"><h2>Expense Register</h2>${rows.length?`<table class="table"><thead><tr><th>Date</th><th>Category</th><th>Amount</th><th>Payment</th><th>Note</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${x.date}</td><td>${esc(x.category)}</td><td>${money(x.amount)}</td><td>${esc(x.payment)}</td><td>${esc(x.note)}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">No expenses yet.</div>'}</div>`}function addExpense(){const a=n('exAmount');if(a<=0)return alert('Enter expense amount.');db.expenses.push({id:uid(),date:dateStr(),created:nowStamp(),category:v('exCategory'),amount:a,payment:v('exPayment'),note:v('exNote')});save();alert('Expense saved.')}

function renderDeliveries(){const rows=[...db.deliveries].sort((a,b)=>b.created.localeCompare(a.created));document.getElementById('deliveries').innerHTML=`<div class="form-card"><h2>Delivery Board</h2><div class="alert">Delivery orders are automatically created when a sale is saved with channel = Delivery.</div></div><div class="section">${rows.length?`<div class="table-wrap"><table class="table"><thead><tr><th>Date</th><th>Customer</th><th>Phone</th><th>Address</th><th>Amount</th><th>Payment</th><th>Status</th><th></th></tr></thead><tbody>${rows.map(x=>`<tr><td>${x.date}</td><td>${esc(x.customer)}</td><td>${esc(x.phone)}</td><td>${esc(x.address)}</td><td>${money(x.amount)}</td><td>${esc(x.payment)}</td><td><span class="tag ${x.status==='Delivered'?'green':x.status==='Cancelled'?'red':'yellow'}">${esc(x.status)}</span></td><td><select onchange="setDelivery('${x.id}',this.value)"><option ${x.status==='Pending'?'selected':''}>Pending</option><option ${x.status==='Out for Delivery'?'selected':''}>Out for Delivery</option><option ${x.status==='Delivered'?'selected':''}>Delivered</option><option ${x.status==='Cancelled'?'selected':''}>Cancelled</option></select></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No delivery orders.</div>'}</div>`}function setDelivery(id,status){const d=db.deliveries.find(x=>x.id===id);if(d){d.status=status;save()}}

function renderCustomers(){const rows=db.customers;document.getElementById('customers').innerHTML=`<div class="form-card"><h2>Customer Register</h2><div class="form-grid"><div class="field"><label>Name</label><input id="cusName"></div><div class="field"><label>Phone</label><input id="cusPhone"></div><div class="field"><label>Type</label><select id="cusType"><option>Retail</option><option>B2B</option></select></div><div class="field span-2"><label>Address</label><input id="cusAddress"></div><div class="field"><label>Notes</label><input id="cusNotes"></div></div><div class="actions"><button class="btn primary" onclick="addCustomer()">Save Customer</button></div></div><div class="section"><h2>Customers</h2>${rows.length?`<table class="table"><thead><tr><th>Name</th><th>Phone</th><th>Type</th><th>Address</th><th>Sales</th><th></th></tr></thead><tbody>${rows.map(c=>{const sales=sum(db.sales.filter(s=>s.phone===c.phone),x=>x.total);return `<tr><td>${esc(c.name)}</td><td>${esc(c.phone)}</td><td>${esc(c.type)}</td><td>${esc(c.address)}</td><td>${money(sales)}</td><td><button class="btn small danger" onclick="delCustomer('${c.id}')">Delete</button></td></tr>`}).join('')}</tbody></table>`:'<div class="empty">No customers saved.</div>'}</div>`}function addCustomer(){if(!v('cusName'))return alert('Enter customer name.');db.customers.push({id:uid(),name:v('cusName'),phone:v('cusPhone'),type:v('cusType'),address:v('cusAddress'),notes:v('cusNotes')});save()}function delCustomer(id){if(confirm('Delete customer?')){db.customers=db.customers.filter(x=>x.id!==id);save()}}

function renderSuppliers(){const rows=db.suppliers;document.getElementById('suppliers').innerHTML=`<div class="form-card"><h2>Supplier Register</h2><div class="form-grid"><div class="field"><label>Supplier Name</label><input id="supName"></div><div class="field"><label>Phone</label><input id="supPhone"></div><div class="field span-2"><label>Notes</label><input id="supNotes"></div></div><div class="actions"><button class="btn primary" onclick="addSupplier()">Save Supplier</button></div></div><div class="section"><h2>Suppliers</h2>${rows.length?`<table class="table"><thead><tr><th>Name</th><th>Phone</th><th>Purchase Total</th><th>Notes</th></tr></thead><tbody>${rows.map(s=>{const total=sum(db.purchases.filter(p=>p.supplier===s.name),x=>x.total);return `<tr><td>${esc(s.name)}</td><td>${esc(s.phone)}</td><td>${money(total)}</td><td>${esc(s.notes)}</td></tr>`}).join('')}</tbody></table>`:'<div class="empty">No suppliers saved.</div>'}</div>`}function addSupplier(){if(!v('supName'))return alert('Enter supplier name.');db.suppliers.push({id:uid(),name:v('supName'),phone:v('supPhone'),notes:v('supNotes')});save()}

function renderStaff(){const rows=db.staff;document.getElementById('staff').innerHTML=`<div class="form-card"><h2>Staff Register</h2><div class="form-grid"><div class="field"><label>Name</label><input id="stName"></div><div class="field"><label>Role</label><input id="stRole" placeholder="Worker / Delivery / Manager"></div><div class="field"><label>Pay Type</label><select id="stPay"><option>Monthly Salary</option><option>Daily Wage</option></select></div><div class="field"><label>Amount</label><input id="stAmount" type="number" step="0.01"></div><div class="field span-2"><label>Responsibilities</label><textarea id="stResp"></textarea></div></div><div class="actions"><button class="btn primary" onclick="addStaff()">Save Staff</button></div></div><div class="section"><h2>Staff</h2>${rows.length?`<table class="table"><thead><tr><th>Name</th><th>Role</th><th>Pay Type</th><th>Amount</th><th>Responsibilities</th></tr></thead><tbody>${rows.map(s=>`<tr><td>${esc(s.name)}</td><td>${esc(s.role)}</td><td>${esc(s.payType)}</td><td>${money(s.amount)}</td><td>${esc(s.resp)}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">No staff saved.</div>'}</div>`}function addStaff(){if(!v('stName'))return alert('Enter name.');db.staff.push({id:uid(),name:v('stName'),role:v('stRole'),payType:v('stPay'),amount:n('stAmount'),resp:v('stResp')});save()}

function renderReports(){const sales=sum(db.sales,x=>x.total),cogs=sum(db.sales,x=>x.cost*x.qty),exp=sum(db.expenses,x=>x.amount),net=sales-cogs-exp,proc=sum(db.processing,x=>x.dressedKg),liveIn=sum(db.processing,x=>x.liveKg),loss=liveIn-proc,yieldPct=liveIn?proc/liveIn*100:0;const byProduct={};db.sales.forEach(x=>{const p=findProd(x.productId),k=p?.name||'Unknown';byProduct[k]=(byProduct[k]||0)+x.total});document.getElementById('reports').innerHTML=`<div class="grid"><div class="card metric"><div class="label">All-time Sales</div><div class="value">${money(sales)}</div></div><div class="card metric"><div class="label">Estimated COGS</div><div class="value">${money(cogs)}</div></div><div class="card metric"><div class="label">All Expenses</div><div class="value">${money(exp)}</div></div><div class="card metric"><div class="label">Estimated Net Profit</div><div class="value ${net>=0?'positive':'negative'}">${money(net)}</div></div></div><div class="grid section"><div class="card metric"><div class="label">Processed Live KG</div><div class="value">${qty(liveIn)}</div></div><div class="card metric"><div class="label">Dressed KG Produced</div><div class="value">${qty(proc)}</div></div><div class="card metric"><div class="label">Process Loss KG</div><div class="value">${qty(loss)}</div></div><div class="card metric"><div class="label">Overall Yield</div><div class="value">${qty(yieldPct)}%</div></div></div><div class="two section"><div class="card"><h2>Sales by Product</h2><table class="table"><thead><tr><th>Product</th><th>Sales</th></tr></thead><tbody>${Object.entries(byProduct).sort((a,b)=>b[1]-a[1]).map(([k,z])=>`<tr><td>${esc(k)}</td><td>${money(z)}</td></tr>`).join('')||'<tr><td colspan="2">No data</td></tr>'}</tbody></table></div><div class="card"><h2>Partner View</h2><p>Total estimated profit: <b>${money(net)}</b></p><p>You: <b>${money(net*db.settings.partnerShare/100)}</b></p><p>Partner: <b>${money(net*(100-db.settings.partnerShare)/100)}</b></p><div class="notice">Management estimate based on entered data. Verify stock, purchase invoices, wastage and expenses before settlement.</div></div></div>`}

function renderGuide(){document.getElementById('guide').innerHTML=`<div class="card"><h2>ChickPro Manager v2 — Use Guide</h2><div class="highlight"><b>Most important rule:</b> Quantity means the unit shown next to the product. It is not always KG and it is not always one chicken.</div><div class="step"><div class="num">1</div><div><b>Set up products.</b><br>Go to Inventory → Add Product. Choose a unit such as KG, BIRDS, DOZEN, TRAY, PACK or PCS. That unit will appear automatically in Purchases and Sales.</div></div><div class="step"><div class="num">2</div><div><b>Buy live chicken.</b><br>Purchases → choose Live Chicken. Quantity = <b>total live weight in KG</b>. Enter Number of Birds separately. Example: 100 birds weighing 185 KG → Quantity = 185 KG, Birds = 100.</div></div><div class="step"><div class="num">3</div><div><b>Record mortality/wastage.</b><br>Chicken Process → record KG loss and optional bird count. The system reduces live stock.</div></div><div class="step"><div class="num">4</div><div><b>Process chicken.</b><br>Chicken Process → enter Live KG consumed, Birds Processed and Dressed KG Produced. The system calculates yield and updates Fresh Cut Chicken stock and estimated cost per KG.</div></div><div class="step"><div class="num">5</div><div><b>Sell.</b><br>Sales → select the product. The screen displays its unit. Example: Fresh Cut Chicken = 2 KG; Eggs = 3 DOZEN; Frozen Item = 4 PACK.</div></div><div class="step"><div class="num">6</div><div><b>Delivery.</b><br>For delivery orders, select Channel = Delivery. A delivery task is created automatically.</div></div><div class="step"><div class="num">7</div><div><b>Daily close.</b><br>Review Dashboard: sales, purchases, expenses, profit, live stock, processing and wastage. Then Settings → Download Backup.</div><div class="formula">Live closing KG = Opening KG + Purchases KG − Processing KG − Wastage KG − Live sales KG (if used)</div></div><div class="step"><div class="num">8</div><div><b>Profit.</b><br>Estimated COGS uses each sale's recorded cost per unit. Fresh-cut chicken cost is updated from live cost and actual processing yield.</div></div></div>`}

function renderSettings(){document.getElementById('settings').innerHTML=`<div class="form-card"><h2>ChickPro Settings</h2><div class="form-grid"><div class="field"><label>Shop Name</label><input id="setName" value="${esc(db.settings.shopName)}"></div><div class="field span-2"><label>Tagline</label><input id="setTag" value="${esc(db.settings.tagline)}"></div><div class="field"><label>Phone 1</label><input id="setP1" value="${esc(db.settings.phone1)}"></div><div class="field"><label>Phone 2</label><input id="setP2" value="${esc(db.settings.phone2)}"></div><div class="field"><label>Partner Share % (You)</label><input id="setShare" type="number" value="${db.settings.partnerShare}" min="0" max="100"></div></div><div class="actions"><button class="btn primary" onclick="saveSettings()">Save Settings</button></div></div><div class="form-card section"><h2>Backup & Restore</h2><p class="notice">This free version stores data in this browser/device. Download a backup regularly.</p><div class="toolbar"><button class="btn green" onclick="exportBackup()">Download Backup</button><label class="btn blue">Restore Backup<input type="file" accept="application/json" onchange="importBackup(this)" hidden></label><button class="btn" onclick="exportCSV()">Export Sales CSV</button><button class="btn danger" onclick="resetAll()">Reset All Data</button></div></div><div class="form-card section"><h2>Version 2 updates</h2><p>Explicit product units, live-chicken bird count + KG, chicken processing/yield, mortality/wastage, fresh-cut cost per KG, and a built-in use guide have been added.</p></div>`}
function saveSettings(){db.settings.shopName=v('setName')||'ChickPro';db.settings.tagline=v('setTag')||'Freshness you can trust!';db.settings.phone1=v('setP1');db.settings.phone2=v('setP2');db.settings.partnerShare=Math.max(0,Math.min(100,n('setShare')));save();alert('Settings saved.')}
function exportBackup(){const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'});downloadBlob(blob,'chickpro-v2-backup-'+dateStr()+'.json')}
function importBackup(inp){const f=inp.files?.[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(!x.products||!x.sales)return alert('Invalid backup.');db=normalizeDB(x);save();alert('Backup restored.')}catch(e){alert('Could not restore backup.')}};r.readAsText(f)}
function exportCSV(){const head=['Date','Customer','Phone','Channel','Product','Qty','Unit','Rate','Total','Cost','Profit','Payment','Note'];const lines=[head,...db.sales.map(x=>{const p=findProd(x.productId);return[x.date,x.customer,x.phone,x.channel,p?.name||'',x.qty,x.unit,x.rate,x.total,x.cost,x.total-x.cost*x.qty,x.payment,x.note]})].map(r=>r.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(','));downloadBlob(new Blob([lines.join('\n')],{type:'text/csv'}),'chickpro-sales-'+dateStr()+'.csv')}
function downloadBlob(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function resetAll(){if(!confirm('This will erase all ChickPro data in this browser. Continue?'))return;db=freshDB();save();go('dashboard')}
function updateTop(){const s=stats();document.getElementById('topKpis').innerHTML=`<div class="kpi">Today: <b>${money(s.sales)}</b></div><div class="kpi">Profit: <b class="${s.net>=0?'positive':'negative'}">${money(s.net)}</b></div>`}
function renderAll(){nav();updateTop();document.getElementById('today').textContent=new Date().toLocaleString('en-PK');renderDashboard();renderSales();renderPurchases();renderChicken();renderInventory();renderExpenses();renderDeliveries();renderCustomers();renderSuppliers();renderStaff();renderReports();renderGuide();renderSettings();document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));document.getElementById(currentPage).classList.add('active')}
renderAll();
</script></body></html>
